# DIAGNOSTIC RUN (2026-11-11): same checkpoint, harness and tasks as aw116_v3_s0, plus verified no-effect
# masking: an action already seen to change nothing on this screen is replaced by the model's own next-best option
# of the same pass. Measures how much of the failure is repeated no-op actions (84% repeat rate measured).
# PARALLEL HALF A: first 58 of hostscripts/aw116_tasks.txt (emulator aw-emu, run dir aw116_v3_s0). Same checkpoint, harness and protocol as aw116_v3_s0.yaml;
# the two halves are merged into one 116-task result.
# v3 seed 0 online (2026-11-11): contract v3 — v2a + state with progress, current app and previous actions with element and
# effect (history_format v3), keyboard excluded from the list, v3 option texts. Track VA (elements sent). Harness awhV5.
# Preflight with --expect-contract v3; run_bench refuses to start unless /health says contract v3 and img_width 720.
protocol: aw-main-v1
agent: d1_v3_s0_mask
checkpoint: v3_s0_ckpt1824
model:
  url: http://172.17.0.1:8701
  token: tok  # localhost-only API behind an SSH tunnel; not a secret
  track: VA
  return_readouts: true
  history_format: v3
  img_width: 720
  done_threshold: 0.0
environment:
  url: http://127.0.0.1:5000
  serial: emulator-5554
  adb_path: /opt/android/platform-tools/adb
  memory_gb: 24
  emulator_setup: false
suite:
  family: android_world
  seed: 30
  n_task_combinations: 1
  step_budgets_file: /tmp/budgets.json
  tasks:
    - AudioRecorderRecordAudio
    - AudioRecorderRecordAudioWithFileName
