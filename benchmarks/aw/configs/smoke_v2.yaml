# Protocol aw-main-v1: the upstream contract, with no deviation.
#
# `done_threshold: 0` is not a tuning choice, it is the absence of one. Upstream lets the agent
# decide `done` (episode_runner.py:60-84 runs until `result.done`); gating it makes the
# success rate incomparable with every recorded number. The gate existed to refuse premature
# `status`, and the signal behind it turned out to be a restatement of the action label
# (benchmarks/results/2026-11-10-episodic-s0-fails-prereg.md: `step == n_steps` and
# `action == status` are the same 137 of 824 rows, so `auroc_nonterm` is not computable).
protocol: aw-main-v1
agent: d1_episodic
checkpoint: episodic-s0@938
model:
  url: http://172.17.0.1:8701
  token: tok
  track: V
  return_readouts: true
  # Explicit 0, not omitted: a reader must be able to see that the gate is off.
  done_threshold: 0.0
environment:
  url: http://127.0.0.1:5000
  serial: emulator-5554
  adb_path: /opt/android/platform-tools/adb
  memory_gb: 24
  emulator_setup: false
suite:
  family: android_world
  seed: 30
  n_task_combinations: 1
  # Per-task budget, int(10*complexity), exactly how upstream allocates it
  # (suite_utils.py:_allocate_step_budget). Produced inside the container by
  # dump_step_budgets.py. The file lives in the container's /tmp and is DELETED when the
  # container is recreated, so it must be regenerated on every emulator restart.
  step_budgets_file: /tmp/budgets.json
  tasks:
  - SystemWifiTurnOn
  - CameraTakePhoto
  - ClockStopWatchRunning
  - MarkorCreateNote
  - SimpleSmsSend
