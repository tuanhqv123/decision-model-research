protocol: aw-main-v1
agent: d1_appint
checkpoint: appint_full@938
model:
  url: http://172.17.0.1:8700
  token: SET_AT_RUN_TIME
  track: V
  return_readouts: true
environment:
  url: http://127.0.0.1:5051
  serial: emulator-5554
  adb_path: /opt/android/platform-tools/adb
  memory_gb: 24
  # The APKs are already installed in this container (93 episodes have run). Re-running the
  # ~5-8 min setup on every resume both wastes time and can fail on a transient a11y dump, which
  # is what ended the 2026-11-08 resume attempt before a single episode started.
  emulator_setup: false
