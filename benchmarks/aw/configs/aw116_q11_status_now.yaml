# Q11 — floor of the official metric (plan Stage 1.2): declare `status` at step 0 on all 116 tasks.
# Scores exactly the tasks whose initial state already satisfies the checker. No model is called.
protocol: aw-main-v1
agent: status_now
checkpoint: none
model:
  url: http://172.17.0.1:8701
  token: tok  # localhost-only API behind an SSH tunnel; not a secret
  track: V
  return_readouts: true
  done_threshold: 0.0
environment:
  url: http://127.0.0.1:5000
  serial: emulator-5554
  adb_path: /opt/android/platform-tools/adb
  memory_gb: 24
  emulator_setup: false
suite:
  family: android_world
  seed: 30
  n_task_combinations: 1
  step_budgets_file: /tmp/budgets.json
  tasks: all
