# R1 seed 1 online (amendment A1: seed 0 gave |w - l| = 6 on 116, 7 on 104) (pre-registration §1, amendments A1, A2, A2-bis). Contract v1 checkpoint: history =
# executed actions, no memory, no is_done, 9 actions. Compared with B0' on the same instances.
# Preflight with --expect-contract v1.
protocol: aw-main-v1
agent: d1_r1_s1
checkpoint: v1_s1
model:
  url: http://172.17.0.1:8701
  token: tok  # localhost-only API behind an SSH tunnel; not a secret
  track: V
  return_readouts: true
  done_threshold: 0.0
environment:
  url: http://127.0.0.1:5000
  serial: emulator-5554
  adb_path: /opt/android/platform-tools/adb
  memory_gb: 24
  emulator_setup: false
suite:
  family: android_world
  seed: 30
  n_task_combinations: 1
  step_budgets_file: /tmp/budgets.json
  tasks: all
