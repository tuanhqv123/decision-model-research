<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Style: framed-sheet (seed 121097847). Grid: 228px sidebar + fluid main; the sheet is inset 8px right and bottom.
   Inside the sheet: chat column (1fr) + phone pane (400px). 228 + (W - 228 - 8) + 8 = W. */
:root {
  --ground: #f9fbfc; --surface: #ffffff; --raised: #f4f6f8; --active: #ebedee;
  --border: #e8eaec; --rule: #f0f1f2; --control: #cdced1;
  --text: #131416; --muted: #5d5f60; --faint: #6b6b6b;
  --primary: #1d1f20; --accent: #1b6c80;
  --positive: #1e7b4f; --negative: #c4242a; --warning: #92400e;
  --pill-positive-bg: #dcfae5; --pill-positive-ink: #04250e;
  --pill-negative-bg: #ffedea; --pill-negative-ink: #831c1e;
  --pill-warning-bg: #fffbeb; --pill-warning-ink: #92400e;
  --pill-neutral-bg: #ebedee; --pill-neutral-ink: #353736;
  --radius-card: 8px; --radius-control: 6px; --radius-sheet: 16px;
  --sidebar: 228px; --bar: 48px; --phone-pane: 400px;
  --font: "IBM Plex Sans", Inter, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font: 14px/20px var(--font);
  display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); grid-template-rows: var(--bar) minmax(0, 1fr); }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.id { font-family: var(--mono); font-size: 12px; }

/* ---------- sidebar: on the frame, no rule ---------- */
#side { grid-row: 1 / 3; display: flex; flex-direction: column; min-height: 0; padding: 0 12px 12px; }
.brand { height: var(--bar); display: flex; align-items: center; gap: 10px; padding: 0 4px; font-weight: 600; font-size: 15px; }
.brand svg { flex: none; }
.btn { height: 32px; padding: 0 12px; border-radius: var(--radius-control); border: 1px solid var(--control);
  background: var(--surface); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: #33363a; }
.btn.danger { color: var(--negative); }
.btn[disabled] { color: var(--faint); background: var(--raised); cursor: default; }
#newTask { width: 100%; justify-content: flex-start; margin: 4px 0 20px; }
.group { font-size: 12px; color: var(--muted); padding: 0 8px 6px; }
#runs { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; }
#runs button { width: 100%; height: 32px; margin-bottom: 2px; border: 0; background: none; border-radius: 8px;
  display: flex; align-items: center; gap: 8px; padding: 0 8px; text-align: left; }
#runs button:hover { background: var(--active); }
#runs button[aria-current="true"] { background: var(--active); }
#runs .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#runs .dur { color: var(--muted); font-size: 12px; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.ok { background: var(--positive); } .dot.bad { background: var(--negative); } .dot.run { background: var(--accent); }
.empty-runs { color: var(--muted); font-size: 13px; padding: 0 8px; }
.setup { margin: 12px 0 0; padding: 12px 8px 0; font-size: 12px; line-height: 18px; color: var(--muted); }
.setup div { display: flex; justify-content: space-between; gap: 8px; }
.setup b { font-weight: 500; color: var(--text); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- top bar: on the frame, no rule ---------- */
#bar { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 8px; min-width: 0; }
#bar h1 { font-size: 16px; font-weight: 600; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { flex: none; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); white-space: nowrap; }
.pill.ok { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.pill.bad { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
.pill.warn { background: var(--pill-warning-bg); color: var(--pill-warning-ink); }
#figures { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
#figures b { color: var(--text); font-weight: 500; }
.only-narrow { display: none; }

/* ---------- the sheet ---------- */
#sheet { margin: 0 8px 8px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sheet);
  display: grid; grid-template-columns: minmax(0, 1fr) var(--phone-pane); min-height: 0; overflow: hidden; }
#chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#log { flex: 1; overflow: auto; padding: 24px 24px 8px; scroll-behavior: smooth; }
.col { max-width: 820px; margin: 0 auto; }

/* user turn */
.user { display: flex; justify-content: flex-end; margin: 0 0 16px; }
.user div { max-width: 78%; background: var(--raised); border-radius: 16px; padding: 10px 14px; font-size: 15px; line-height: 22px; white-space: pre-wrap; }

/* agent trajectory: a label column and a content column, one left edge for every row */
.row { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 12px; padding: 6px 0; align-items: baseline; }
.row .k { color: var(--muted); font-size: 12px; }
.row .t { color: var(--muted); font-size: 12px; }
.row.dma .k { color: var(--accent); font-weight: 500; }
.row.bad .k { color: var(--negative); font-weight: 500; }
.row.warn .k { color: var(--warning); font-weight: 500; }
.thought { color: var(--muted); border-left: 2px solid var(--border); padding-left: 12px; white-space: pre-wrap;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.thought.open { display: block; }
.more { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; margin-top: 2px; }
.goal { font-weight: 500; }
.sub { color: var(--muted); }
.step { margin-top: 10px; }
.act { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.act q { quotes: "\201C" "\201D"; }
/* the signature element: DMA-2B's probability against the ask threshold */
.conf { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.track { position: relative; width: 64px; height: 4px; border-radius: 2px; background: var(--active); }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); }
.track i.low { background: #a86f0c; }
.track b { position: absolute; top: -3px; width: 1px; height: 10px; background: var(--text); }
.ask { margin: 8px 0 8px 100px; border: 1px solid var(--border); border-radius: var(--radius-card); padding: 16px; }
.ask h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.ask p { margin: 0 0 12px; color: var(--muted); }
.ask .actions { display: flex; gap: 8px; align-items: center; }
.ask input { flex: 1; min-width: 0; height: 32px; border: 1px solid var(--control); border-radius: var(--radius-control); padding: 0 10px; }
.result { margin: 12px 0 24px 100px; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); }
.result b { color: var(--text); font-weight: 500; }
.answer { margin: 8px 0 0 100px; font-size: 15px; line-height: 22px; }

/* empty state */
.intro { padding: 8px 0 0; }
.intro h2 { font-size: 22px; line-height: 28px; font-weight: 600; margin: 0 0 8px; }
.intro p { color: var(--muted); margin: 0 0 20px; max-width: 620px; }
.intro .grp { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.tries { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.tries button { border: 0; background: none; padding: 6px 8px; margin-left: -8px; border-radius: 8px; text-align: left; }
.tries button:hover { background: var(--raised); }

/* composer: a bordered box at the foot of the chat */
#composer { padding: 8px 24px 20px; }
.box { max-width: 820px; margin: 0 auto; border: 1px solid var(--control); border-radius: 16px; background: var(--surface);
  padding: 10px 10px 10px 14px; display: flex; align-items: flex-end; gap: 10px; }
.box:focus-within { border-color: var(--muted); }
.box textarea { flex: 1; border: 0; outline: 0; resize: none; max-height: 140px; min-height: 24px; line-height: 22px; font-size: 15px; padding: 2px 0; background: none; }
.box textarea::placeholder { color: var(--faint); }
.send { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--primary); color: #fff;
  display: grid; place-items: center; }
.send:hover { background: #33363a; }
.send[disabled] { background: var(--active); color: var(--faint); cursor: default; }
.note { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

/* phone pane */
#phone { border-left: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; padding: 16px 24px 20px; gap: 12px; }
.ph { display: flex; align-items: baseline; gap: 8px; }
.ph h2 { font-size: 16px; font-weight: 600; margin: 0; }
.ph span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.screen { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
#screen { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 12px; background: #000; }
#screen.tappable { cursor: crosshair; }
.keys { display: flex; align-items: center; gap: 8px; }
.keys .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
#closePhone { display: none; }

/* ---------- tablet and phone ---------- */
@media (max-width: 1100px) { :root { --phone-pane: 340px; } }
@media (max-width: 900px) {
  body { grid-template-columns: minmax(0, 1fr); }
  #side { display: none; position: fixed; inset: 0; z-index: 20; background: var(--ground); padding-top: 4px; }
  #side.open { display: flex; }
  #bar { padding: 0 12px; }
  .only-narrow { display: inline-flex; }
  #figures { display: none; }
  #sheet { margin: 0; border-radius: 0; border-width: 1px 0 0; grid-template-columns: minmax(0, 1fr); }
  #phone { display: none; position: fixed; inset: 0; z-index: 20; background: var(--surface); border: 0; }
  #phone.open { display: flex; }
  #closePhone { display: inline-flex; margin-left: auto; }
  #log { padding: 16px 16px 8px; }
  #composer { padding: 8px 16px 16px; }
  .row { grid-template-columns: 72px minmax(0, 1fr); }
  .row .t { display: none; }
  .ask, .result, .answer { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { #log { scroll-behavior: auto; } }
</style>
</head>
<body>

<nav id="side" aria-label="Tasks">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4.75" y="1.75" width="10.5" height="16.5" rx="2.25" fill="none" stroke="#131416" stroke-width="1.5"/><circle cx="10" cy="8.5" r="2.5" fill="#1b6c80"/></svg>
    DMAgent
    <button class="btn only-narrow" style="margin-left:auto" onclick="toggleSide(false)" aria-label="Close menu">Close</button>
  </div>
  <button class="btn" id="newTask" onclick="newTask()">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>New task</button>
  <div class="group">Tasks</div>
  <ul id="runs"></ul>
  <div class="setup" id="setup"></div>
</nav>

<header id="bar">
  <button class="btn only-narrow" onclick="toggleSide(true)" aria-label="Open menu">Menu</button>
  <h1 id="title">New task</h1>
  <span id="status"></span>
  <span id="figures" class="num"></span>
  <button class="btn only-narrow" onclick="togglePhone(true)">Phone</button>
</header>

<main id="sheet">
  <section id="chat" aria-label="Conversation">
    <div id="log" aria-live="polite"><div class="col" id="col"></div></div>
    <form id="composer" onsubmit="send(event)">
      <div class="box">
        <textarea id="task" rows="1" placeholder="Give the phone a task" aria-label="Task"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="Start task">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        </button>
      </div>
      <div class="note" id="composerNote"></div>
    </form>
  </section>

  <aside id="phone" aria-label="Phone">
    <div class="ph"><h2>Phone</h2><span id="where"></span>
      <button class="btn" id="closePhone" onclick="togglePhone(false)">Close</button></div>
    <div class="screen"><img id="screen" src="/api/stream" alt="Live screen of the phone" onclick="tap(event)"></div>
    <div class="keys">
      <button class="btn" id="kBack" onclick="key('back')">Back</button>
      <button class="btn" id="kHome" onclick="key('home')">Home</button>
      <span class="hint" id="hint"></span>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const secs = t => { if (t == null) return ""; if (t < 60) return t.toFixed(1) + " s";
  const r = Math.round(t); return Math.floor(r / 60) + ":" + String(r % 60).padStart(2, "0"); };
// a duration (not a time of day): "42 s", "2 m 38 s", "14 m"
const dur = (t, short) => { if (t == null) return ""; const r = Math.round(t); if (r < 60) return r + " s";
  const m = Math.floor(r / 60); return short || m >= 10 ? m + " m" : m + " m " + (r % 60) + " s"; };
const HARNESS = {"navigate_back": "Back", "navigate_home": "Home", "scroll up": "Scroll up", "scroll down": "Scroll down",
  "scroll left": "Scroll left", "scroll right": "Scroll right"};
const EXAMPLES = ["Turn off Wi-Fi", "Turn on airplane mode",
  "Create a new note in Markor named groceries with the text: bread and butter",
  "Add a contact named Linh Tran with the number 0912 345 678"];
const OUTCOME = o => !o ? ["Running", ""] : o === "finished" ? ["Finished", "ok"] : o === "answered" ? ["Answered", "ok"]
  : o.startsWith("stopped") ? ["Stopped", "warn"] : o.startsWith("error") ? ["Error", "bad"] : [o, ""];

let S = null, view = "live", viewRun = null, open = new Set(), lastKey = "", lastLen = -1;

/* ---------- rendering the trajectory ---------- */
function confBar(p, thr) {
  if (p == null) return "";
  const low = thr != null && p < thr;
  return `<span class="conf num" title="DMA-2B probability; below ${thr} the person is asked">
    <span class="track"><i class="${low ? "low" : ""}" style="width:${Math.round(p * 100)}%"></i>${thr != null ? `<b style="left:${Math.round(thr * 64)}px"></b>` : ""}</span>p ${p.toFixed(3)}</span>`;
}
function thoughtRow(txt, id, label = "Thought") {
  if (!txt) return "";
  const isOpen = open.has(id);
  return `<div class="row"><span class="k">${label}</span><div><div class="thought ${isOpen ? "open" : ""}" id="th${id}">${esc(txt)}</div>
    ${txt.length > 220 ? `<button class="more" onclick="flip('${id}')">${isOpen ? "Show less" : "Show all"}</button>` : ""}</div><span></span></div>`;
}
function row(k, body, t, cls = "") {
  return `<div class="row ${cls}"><span class="k">${k}</span><div>${body}</div><span class="t num">${secs(t)}</span></div>`;
}
function askPanel(p) {
  if (p.kind === "question") return `<div class="ask"><h3>The agent asks you</h3><p>${esc(p.reason)}</p>
    <div class="actions"><input id="reply" placeholder="Your answer" aria-label="Your answer" onkeydown="if(event.key==='Enter')answer(true)">
    <button class="btn primary" onclick="answer(true)">Send</button><button class="btn" onclick="answer(false)">Skip</button></div></div>`;
  const sens = p.kind === "sensitive";
  const why = sens ? esc(p.reason) : `below the ask threshold of ${thrOf()}`;
  return `<div class="ask"><h3>${sens ? "Allow this action?" : "DMA-2B is not sure. Allow this tap?"}</h3>
    <p><span class="act"><span>${esc(p.action || "")}</span>${confBar(p.probability, S.info && S.info.confidence)}<span class="sub">${why}</span></span></p>
    <div class="actions"><button class="btn primary" onclick="answer(true)">Allow</button><button class="btn" onclick="answer(false)">Don't allow</button>
    <input id="reply" placeholder="Note for the planner (optional)" aria-label="Note for the planner"></div></div>`;
}
function render(events, summary, pending, info) {
  const thr = info && info.confidence;
  let h = "";
  events.forEach((e, i) => {
    switch (e.type) {
      case "start": h += `<div class="user"><div>${esc(e.task)}</div></div>`; break;
      case "plan": {
        h += `<div class="step"></div>` + thoughtRow(e.thought, "p" + i);
        if (e.next === "local_goal") h += row("Local goal", `<span class="goal">${esc(e.instruction)}</span>`, e.t);
        else if (e.next === "scroll") h += row("Planner", `Scroll ${esc(e.direction)}`, e.t);
        else if (e.next === "back" || e.next === "home") h += row("Planner", e.next === "back" ? "Press Back" : "Go home", e.t);
        else if (e.next === "finish") h += row("Planner", "The task looks done; checking the screen", e.t);
        else if (e.next === "answer") h += row("Planner", "Answer: " + esc(e.text), e.t);
        else if (e.next === "ask_user") h += row("Planner", "Ask you: " + esc(e.question), e.t);
        break; }
      case "action": {
        const planner = e.probability == null;
        const name = e.action.replace(" (planner)", "");
        const body = `<span class="act"><span>${esc(planner ? (HARNESS[name] || name) : name)}</span>${confBar(e.probability, thr)}
          <span class="sub">${e.changed ? "screen changed" : "no change"}</span></span>`;
        h += row(planner ? "Harness" : "DMA-2B", body, e.t, planner ? "" : "dma"); break; }
      case "goal_done": h += row("Done", `<span class="sub">Local goal done after ${e.actions.length} action${e.actions.length === 1 ? "" : "s"}</span>`, e.t); break;
      case "blocked": h += row("Blocked", esc(e.reason) + (e.local_goal ? ` <span class="sub">· ${esc(e.local_goal)}</span>` : ""), e.t, "bad"); break;
      case "recovery": h += row("Recovery", esc(e.reason), e.t, "warn"); break;
      case "unreadable_screen": h += row("Waiting", "The screen could not be read", e.t, "warn"); break;
      case "approval_answer": h += row("You", e.approved ? "Allowed" : "Did not allow", e.t); break;
      case "question": h += row("You", e.answer ? esc(e.answer) : '<span class="sub">No answer</span>', e.t); break;
      case "reflection":
        h += row("Check", e.complete ? "The screen shows the task is complete" : "Not complete yet" + (e.missing ? ": " + esc(e.missing) : ""), e.t, e.complete ? "" : "warn");
        h += thoughtRow(e.thought, "r" + i, ""); break;
      case "error": h += row("Error", esc(e.error), e.t, "bad"); break;
      case "stop": h += row("Stopped", esc(e.reason), e.t, "warn"); break;
    }
  });
  if (pending && view === "live") h += askPanel(pending);
  if (summary) {
    if (summary.answer) h += `<div class="answer">${esc(summary.answer)}</div>`;
    const [label, cls] = OUTCOME(summary.outcome);
    h += `<div class="result num"><span class="pill ${cls}">${label}</span>
      <span><b>${summary.steps}</b> steps</span><span>in <b>${dur(summary.seconds)}</b></span>
      <span><b>${summary.llm_calls}</b> planner calls</span>
      ${summary.model_ms_avg != null ? `<span>DMA-2B <b>${(summary.model_ms_avg / 1000).toFixed(summary.model_ms_avg < 1000 ? 2 : 1)} s</b> per decision</span>` : ""}
      ${summary.approval_requests ? `<span><b>${summary.approval_requests}</b> asked you</span>` : ""}
      ${summary.errors ? `<span><b>${summary.errors}</b> errors</span>` : ""}</div>`;
  }
  return h;
}
function thrOf() { return S && S.info && S.info.confidence != null ? S.info.confidence : "the threshold"; }
function intro(info) {
  return `<div class="intro"><h2>What should the phone do?</h2>
    <p>The planner${info && info.llm_model ? " (" + esc(info.llm_model.split("/").pop()) + ")" : ""} splits your task into steps, and DMA-2B chooses each tap on the screen beside it. You are asked before anything sensitive, and whenever DMA-2B is less sure than ${info && info.confidence != null ? info.confidence : "its threshold"}.</p>
    <div class="grp">Try one</div><div class="tries">${EXAMPLES.map(x => `<button type="button" onclick="useExample(this)">${esc(x)}</button>`).join("")}</div></div>`;
}

/* ---------- screen state ---------- */
function paint() {
  if (!S) return;
  if (view === "new" && S.running) view = "live";          // a task started elsewhere takes the screen
  const live = view === "live";
  const run = view === "run" ? viewRun : null;
  const events = live ? S.events : (run ? run.events : []);
  const summary = live ? (S.running ? null : S.summary) : (run ? run.summary : null);
  const hasTask = events.some(e => e.type === "start");
  const key = JSON.stringify([view, events.length, events.length && events[events.length - 1].t, summary && summary.id, S.pending && S.pending.id, [...open]]);
  if (key !== lastKey) {
    const log = $("log"), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    const first = lastLen === -1, grew = events.length !== lastLen; lastLen = events.length;
    const keepReply = $("reply") ? $("reply").value : "";
    $("col").innerHTML = hasTask ? render(events, summary, S.pending, S.info) : intro(S.info);
    if ($("reply")) $("reply").value = keepReply;
    if (first || (atEnd && grew)) log.scrollTop = log.scrollHeight;
    lastKey = key;
  }
  const task = hasTask ? events.find(e => e.type === "start").task : null;
  $("title").textContent = task || "New task";
  document.title = task ? task + " · DMAgent" : "DMAgent";
  const [label, cls] = live && S.running ? ["Running", ""] : summary ? OUTCOME(summary.outcome) : ["", ""];
  $("status").innerHTML = label ? `<span class="pill ${cls}">${S.pending && live ? "Waiting for you" : label}</span>` : "";
  const nSteps = events.filter(e => e.type === "action").length;
  $("figures").innerHTML = hasTask ? `<b>${nSteps}</b> actions in <b>${dur(events.length ? events[events.length - 1].t : 0)}</b>` : "";
  // composer
  const busy = S.running;
  $("sendBtn").innerHTML = busy ? '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="10" height="10" rx="1.5" fill="currentColor"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>';
  $("sendBtn").setAttribute("aria-label", busy ? "Stop the task" : "Start task");
  $("task").disabled = busy;
  $("task").placeholder = busy ? "The agent is working on the phone" : "Give the phone a task";
  $("composerNote").textContent = busy ? "Stop ends the run after the current action." : "";
  // phone
  const obs = [...S.events].reverse().find(e => e.type === "observe");
  $("where").innerHTML = obs ? `<span class="id">${esc(obs.package || "")}</span> · ${obs.elements} elements` : esc(S.info && S.info.serial || "");
  $("screen").classList.toggle("tappable", !busy);
  $("kBack").disabled = $("kHome").disabled = busy;
  $("hint").textContent = busy ? "The agent is in control" : "Click the screen to tap it";
  // sidebar
  const runs = S.runs.slice().reverse();
  $("runs").innerHTML = (busy ? `<li><button aria-current="${live}" onclick="showLive()"><span class="dot run"></span><span class="name">${esc(task || "Running")}</span><span class="dur">now</span></button></li>` : "")
    + runs.map(r => { const [, c] = OUTCOME(r.outcome);
      return `<li><button aria-current="${!!(run && run.summary.id === r.id)}" onclick="showRun(${r.id})" title="${esc(r.task)}">
        <span class="dot ${c === "ok" ? "ok" : c === "bad" ? "bad" : ""}"></span><span class="name">${esc(r.task)}</span><span class="dur num">${dur(r.seconds, true)}</span></button></li>`; }).join("")
    || (busy ? "" : `<li class="empty-runs">No tasks yet</li>`);
  const i = S.info || {};
  $("setup").innerHTML = [["Phone", `<span class="id">${esc(i.serial || "—")}</span>`],
    ["Executor", "DMA-2B" + (i.dma_device ? " · " + (i.dma_device === "cpu" ? "CPU" : "GPU") : "")],
    ["Planner", esc((i.llm_model || "—").split("/").pop())],
    ["Ask below", i.confidence != null ? "p " + i.confidence : "—"]].map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join("");
}
async function poll() {
  try { S = await (await fetch("/api/state")).json(); paint(); } catch (e) { $("hint").textContent = "Lost the connection; retrying"; }
  setTimeout(poll, S && S.running ? 1000 : 2500);
}

/* ---------- actions ---------- */
const post = (u, b) => fetch(u, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(b || {})});
async function send(ev) {
  ev.preventDefault();
  if (S && S.running) { await post("/api/stop"); return; }
  const t = $("task").value.trim(); if (!t) { $("task").focus(); return; }
  const r = await (await post("/api/start", {task: t})).json();
  if (r.ok) { $("task").value = ""; grow(); view = "live"; viewRun = null; open.clear(); lastKey = ""; lastLen = -1; }
  setTimeout(async () => { S = await (await fetch("/api/state")).json(); paint(); }, 300);
}
async function answer(ok) {
  if (!S || !S.pending) return;
  await post("/api/answer", {id: S.pending.id, approved: ok, note: $("reply") ? $("reply").value : ""});
}
async function tap(ev) {
  if (!S || S.running) return;
  const r = ev.target.getBoundingClientRect();
  await post("/api/tap", {x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height});
}
async function key(k) { if (S && !S.running) await post("/api/key", {key: k}); }
async function showRun(id) {
  viewRun = await (await fetch("/api/runs/" + id)).json(); view = "run"; open.clear(); lastKey = ""; lastLen = -1; paint(); toggleSide(false);
}
function showLive() { view = "live"; viewRun = null; lastKey = ""; lastLen = -1; paint(); toggleSide(false); }
function newTask() { view = S && S.running ? "live" : "new"; viewRun = null; lastKey = ""; lastLen = -1; paint(); toggleSide(false); $("task").focus(); }
function useExample(b) { $("task").value = b.textContent; grow(); $("task").focus(); }
function flip(id) { open.has(id) ? open.delete(id) : open.add(id); lastKey = ""; paint(); }
function toggleSide(on) { $("side").classList.toggle("open", on); }
function togglePhone(on) { $("phone").classList.toggle("open", on); }
function grow() { const t = $("task"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }
$("task").addEventListener("input", grow);
$("task").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); } });
$("screen").addEventListener("error", () => setTimeout(() => { $("screen").src = "/api/stream?" + Date.now(); }, 2000));
poll();
</script>
</body>
</html>
